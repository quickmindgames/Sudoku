name: Build and Deploy Signed AAB

on:
  workflow_dispatch:
  push:
    branches:
      - 'Release/release_*' # Trigger on branches that start with 'release_'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for creating repository tags/releases
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      # Extract version name from build.gradle
      - name: Extract Version Name
        id: get_version
        run: |
          # Works for both Groovy (build.gradle) and Kotlin DSL (build.gradle.kts)
          VERSION_NAME=$(grep "versionName" app/build.gradle* | awk -F '"' '{print $2}' | sed 's/text //g' | tr -d '[:space:]')
          if [ -z "$VERSION_NAME" ]; then
            # Fallback for single quotes if double quotes aren't used
            VERSION_NAME=$(grep "versionName" app/build.gradle* | awk -F "'" '{print $2}' | tr -d '[:space:]')
          fi
          echo "Extracted Version: $VERSION_NAME"
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT

      # The keystore is stored as a base64 GitHub secret, never in the repository.
      # Create it with:  base64 -w0 quickmind.jks
      - name: Decode Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build Signed Release App Bundle
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for name in RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set"
              exit 1
            fi
          done
          ./gradlew bundleRelease

      - name: Remove Release Keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      # Task 1: Create GitHub Release and Tag
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION_NAME }}
          name: Release v${{ steps.get_version.outputs.VERSION_NAME }}
          draft: false
          prerelease: false
          files: app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Task 2: Publish AAB to Google Play Store
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.quickmindgames.sudoku # TODO: Replace with your actual Package ID
          releaseFiles: app/build/outputs/bundle/release/*.aab
          tracks: alpha # Options: internal, alpha, beta, production
          status: completed